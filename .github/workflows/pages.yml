name: Publish org chart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s pipeline -p 'test_*.py'
      - run: python pipeline/validate_dataset.py --data-dir data
      - run: python scripts/build_database.py
      - run: python scripts/evaluate_sql_inference.py --min-precision 0.98 --output public/data/sql_evaluation.json
      - run: python scripts/export_site.py --base-path /orggraph-python
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
