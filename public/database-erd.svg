<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">OrgGraph entity relationship diagram — Keys and relationships</title>
<desc id="desc">Nine tables with non-overlapping connections. Arrows point from referenced to dependent tables. R1 through R12 identify the complete foreign keys listed in the portal.</desc>
<rect width="1200" height="100%" fill="#fafbf8"/>
<style>text{font-family:system-ui,sans-serif;fill:#283c32}.field{font-family:ui-monospace,monospace;font-size:13px}.key{font-family:ui-monospace,monospace;font-size:10px;fill:#4c624e}.edge{font-size:12px;font-weight:600;paint-order:stroke;stroke:#fafbf8;stroke-width:6px;stroke-linejoin:round}.note{font-size:12px;fill:#5c6c5e}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#718776"/></marker></defs>
<text x="40" y="30" class="note">PK  Primary key     FK  Foreign key     Arrow  Referenced → dependent table</text>
<path d="M200.0,340 V300 H520 V236" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="360.0" y="290" text-anchor="middle" class="edge">R1</text>
<path d="M440,156 H360" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="400.0" y="144" text-anchor="middle" class="edge">R2, R3</text>
<path d="M680,236 V340" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="704" y="288.0" text-anchor="middle" class="edge">R4</text>
<path d="M600.0,664 V560" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="624.0" y="612.0" text-anchor="middle" class="edge">R5</text>
<path d="M760,432 H840" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="800.0" y="420" text-anchor="middle" class="edge">R6, R7, R8</text>
<path d="M200.0,560 V664" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="224.0" y="612.0" text-anchor="middle" class="edge">R9</text>
<path d="M440,756 H360" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="400.0" y="744" text-anchor="middle" class="edge">R10</text>
<path d="M760,156 H840" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="800.0" y="144" text-anchor="middle" class="edge">R11</text>
<path d="M1000.0,560 V664" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="1024.0" y="612.0" text-anchor="middle" class="edge">R12</text>
<g aria-label="companies">
<rect x="40" y="340" width="320" height="220" rx="6" fill="white" stroke="#b9c8b9"/>
<path d="M40,402 H360" stroke="#e1e8dd"/>
<text x="56" y="366" font-size="17" font-weight="650">companies</text>
<text x="56" y="387" class="note">One company</text>
<text x="56" y="425" class="key">PK</text>
