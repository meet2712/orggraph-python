<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="640" viewBox="0 0 1810 640" role="img" aria-labelledby="title desc">
<title id="title">How source tables feed the SQL reporting views</title>
<desc id="desc">Five stages run left to right: source tables, title preparation, manager matching, reporting decisions, and inspection. Every view card names its exact direct inputs. Views read source rows on demand and never copy them.</desc>
<defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4b7965"/></marker></defs>
<rect width="1810" height="640" fill="#f7f9f6"/>
<style>text{font-family:system-ui,sans-serif;fill:#283c32}.heading{font-size:19px;font-weight:700}.note{font-size:12px;fill:#526159}.stage{font-size:13px;font-weight:700;letter-spacing:.07em;fill:#315c49}.name{font-size:15px;font-weight:700}.description{font-size:12px;fill:#506159}.reads{font-family:ui-monospace,monospace;font-size:11px;fill:#5b6b5d}.kind{font-size:10px;font-weight:700;fill:#376c50}</style>
<text x="28" y="35" class="heading">Two source tables → live reporting views</text>
<text x="28" y="58" class="note">Arrows trace the main reporting path. Side views can read source tables directly; each “Reads” line gives the exact inputs.</text>
<rect x="20" y="105" width="334" height="480" rx="9" fill="#f0f4ef" stroke="#dae5da"/>
<text x="35" y="137" class="stage">1 · INPUT</text>
<path d="M352,128 H369" fill="none" stroke="#4b7965" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
<g aria-label="companies">
<rect x="28" y="166" width="318" height="96" rx="7" fill="#e4efe6" stroke="#80a98b"/>
<text x="40" y="187" class="name">companies</text>
<text x="40" y="207" class="description">Company details</text>
<text x="40" y="229" class="kind">SOURCE TABLE · stores rows</text>
</g>
<g aria-label="employees">
<rect x="28" y="270" width="318" height="96" rx="7" fill="#e4efe6" stroke="#80a98b"/>
<text x="40" y="291" class="name">employees</text>
<text x="40" y="311" class="description">Messy employee records</text>
<text x="40" y="333" class="kind">SOURCE TABLE · stores rows</text>
</g>
<g aria-label="inference_settings">
<rect x="28" y="374" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="40" y="395" class="name">inference_settings</text>
<text x="40" y="415" class="description">Current decision thresholds</text>
<text x="40" y="437" class="reads">Reads: </text>
</g>
<rect x="376" y="105" width="334" height="480" rx="9" fill="#f0f4ef" stroke="#dae5da"/>
<text x="391" y="137" class="stage">2 · PREPARE</text>
<path d="M708,128 H725" fill="none" stroke="#4b7965" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
<g aria-label="employee_text">
<rect x="384" y="166" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="396" y="187" class="name">employee_text</text>
<text x="396" y="207" class="description">Normalize title and team text</text>
<text x="396" y="229" class="reads">Reads: employees</text>
</g>
<g aria-label="employee_classification">
<rect x="384" y="270" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="396" y="291" class="name">employee_classification</text>
<text x="396" y="311" class="description">Function and seniority</text>
<text x="396" y="333" class="reads">Reads: employee_text</text>
</g>
<g aria-label="employee_features">
<rect x="384" y="374" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="396" y="395" class="name">employee_features</text>
<text x="396" y="415" class="description">One feature set per person</text>
<text x="396" y="437" class="reads">Reads: employee_classification</text>
</g>
<rect x="732" y="105" width="334" height="480" rx="9" fill="#f0f4ef" stroke="#dae5da"/>
<text x="747" y="137" class="stage">3 · MATCH</text>
<path d="M1064,128 H1081" fill="none" stroke="#4b7965" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
<g aria-label="manager_candidates">
<rect x="740" y="166" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="752" y="187" class="name">manager_candidates</text>
<text x="752" y="207" class="description">Plausible same-company leaders</text>
<text x="752" y="229" class="reads">Reads: employee_classification</text>
<text x="752" y="242" class="reads">employee_features</text>
</g>
<g aria-label="candidate_scores">
<rect x="740" y="270" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="752" y="291" class="name">candidate_scores</text>
<text x="752" y="311" class="description">Evidence for each candidate</text>
<text x="752" y="333" class="reads">Reads: manager_candidates</text>
</g>
<g aria-label="employee_top_candidates">
<rect x="740" y="374" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="752" y="395" class="name">employee_top_candidates</text>
<text x="752" y="415" class="description">Best and second-best candidate</text>
<text x="752" y="437" class="reads">Reads: employees, candidate_scores</text>
</g>
<rect x="1088" y="105" width="334" height="480" rx="9" fill="#f0f4ef" stroke="#dae5da"/>
<text x="1103" y="137" class="stage">4 · DECIDE</text>
<path d="M1420,128 H1437" fill="none" stroke="#4b7965" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
<g aria-label="reporting_predictions">
<rect x="1096" y="166" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="1108" y="187" class="name">reporting_predictions</text>
<text x="1108" y="207" class="description">Accept a link or abstain</text>
<text x="1108" y="229" class="reads">Reads: employees, employee_features</text>
<text x="1108" y="242" class="reads">employee_top_candidates, inference_settings</text>
</g>
<g aria-label="prediction_reasons">
<rect x="1096" y="270" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="1108" y="291" class="name">prediction_reasons</text>
<text x="1108" y="311" class="description">Explain the decision</text>
<text x="1108" y="333" class="reads">Reads: reporting_predictions</text>
<text x="1108" y="346" class="reads">inference_settings</text>
</g>
<rect x="1444" y="105" width="334" height="480" rx="9" fill="#f0f4ef" stroke="#dae5da"/>
<text x="1459" y="137" class="stage">5 · INSPECT</text>
<g aria-label="company_profiles">
<rect x="1452" y="166" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="1464" y="187" class="name">company_profiles</text>
<text x="1464" y="207" class="description">Headcount and size band</text>
<text x="1464" y="229" class="reads">Reads: companies, employees</text>
</g>
<g aria-label="company_metrics">
<rect x="1452" y="270" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="1464" y="291" class="name">company_metrics</text>
<text x="1464" y="311" class="description">Per-company coverage</text>
<text x="1464" y="333" class="reads">Reads: reporting_predictions</text>
</g>
<g aria-label="dataset_metrics">
<rect x="1452" y="374" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="1464" y="395" class="name">dataset_metrics</text>
<text x="1464" y="415" class="description">Overall counts and mean score</text>
<text x="1464" y="437" class="reads">Reads: reporting_predictions</text>
</g>
<g aria-label="employee_reporting_audit">
<rect x="1452" y="478" width="318" height="96" rx="7" fill="#ffffff" stroke="#b9cbbd"/>
<text x="1464" y="499" class="name">employee_reporting_audit</text>
<text x="1464" y="519" class="description">Inspect an employee decision</text>
<text x="1464" y="541" class="reads">Reads: reporting_predictions, employees</text>
<text x="1464" y="554" class="reads">employee_features, inference_settings</text>
</g>
<text x="28" y="616" class="note">Green = stored source table · White = calculated SQL view · Views run on query and do not copy rows</text>
</svg>