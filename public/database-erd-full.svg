<path d="M680,380 V484" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="704" y="432.0" text-anchor="middle" class="edge">R4</text>
<path d="M600.0,880 V776" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="624.0" y="828.0" text-anchor="middle" class="edge">R5</text>
<path d="M760,576 H840" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="800.0" y="564" text-anchor="middle" class="edge">R6, R7, R8</text>
<path d="M200.0,776 V880" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="224.0" y="828.0" text-anchor="middle" class="edge">R9</text>
<path d="M440,972 H360" stroke="#718776" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
