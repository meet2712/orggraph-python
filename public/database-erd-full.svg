<text x="56" y="90" font-size="17" font-weight="650">companies</text>
<text x="56" y="111" class="note">One company</text>
<text x="56" y="149" class="key">PK</text>
<text x="104" y="149" class="field">company_id</text>
<text x="346" y="149" text-anchor="end" class="key">TEXT</text>
<text x="56" y="173" class="key"></text>
<text x="104" y="173" class="field">company_name</text>
<text x="346" y="173" text-anchor="end" class="key">TEXT</text>
<text x="56" y="197" class="key"></text>
